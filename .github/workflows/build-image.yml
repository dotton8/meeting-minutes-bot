# CI: run the tests, then build the container image and publish it to GitHub Container Registry.
# (Azure for Students blocks ACR Tasks, so the image is built here and Azure only pulls it.)
name: test-and-build-image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run tests (Azure calls are stubbed, no keys needed)
        run: python -m pytest -q

  build-image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: GIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/dotton8/meeting-minutes-bot:latest
            ghcr.io/dotton8/meeting-minutes-bot:${{ github.sha }}
